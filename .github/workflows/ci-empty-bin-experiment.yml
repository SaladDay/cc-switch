name: CI empty-bin paired experiment
on:
  push:
    branches: [experiment/ci-empty-bin-20261123]
permissions:
  contents: read
jobs:
  paired:
    name: Paired empty-bin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    env:
      CARGO_BUILD_JOBS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev || sudo apt-get install -y --no-install-recommends libsoup2.4-dev
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
        with:
          tool: cargo-nextest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Paired measurement on same runner
        run: |
          mkdir -p dist
          python .github/experiments/empty-bin.py
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: empty-bin-${{ matrix.os }}
          path: experiment-results/
